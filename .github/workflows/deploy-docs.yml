# Builds docs on PRs and docs-related pushes to main; deploys on final release tags (vX.Y.Z).
name: Docs

on:
  push:
    branches:
      - main
    tags:
      # Final releases only; pre-release tags (v7.0.0.pre.1, v7.0.0-rc1) do not match.
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths: &docs_paths
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-docs.yml'
      - 'Rakefile'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'requirements-lock.txt'
      - 'bin/*docs*'
      - 'lib/cov_loupe/scripts/*doc*'
  pull_request:
    paths: *docs_paths

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  docs:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Build docs
        if: github.ref_type != 'tag'
        run: bundle exec rake docs:build

      - name: Build and deploy docs
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: bundle exec rake docs:deploy
