name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run tests (${{ matrix.os }}, Ruby ${{ matrix.ruby-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Full Ruby matrix on Linux; one representative Ruby on Windows and
        # macOS to exercise the OS-specific path handling in lib/cov_loupe/paths/.
        os: [ubuntu-latest]
        ruby-version: ['3.2', '3.3', '3.4', '4.0', jruby]
        include:
          - os: windows-latest
            ruby-version: '4.0'
          - os: macos-latest
            ruby-version: '4.0'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rspec

    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      if: matrix.os == 'ubuntu-latest' && matrix.ruby-version == '3.3'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/coverage.xml
        fail_ci_if_error: false

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.6'
        bundler-cache: true

    - name: Audit dependencies for vulnerabilities
      run: bundle exec bundle audit check --update

    - name: Audit Ruby version for vulnerabilities
      run: bundle exec ruby-audit check

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.6'
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop
