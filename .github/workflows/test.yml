name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run tests (${{ matrix.os }}, Ruby ${{ matrix.ruby-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Full Ruby matrix on Linux; one representative Ruby on Windows and
        # macOS to exercise the OS-specific path handling in lib/cov_loupe/paths/.
        os: [ubuntu-latest]
        ruby-version: ['3.2', '3.3', '3.4', '4.0', jruby]
        include:
          - os: windows-latest
            ruby-version: '4.0'
          - os: macos-latest
            ruby-version: '4.0'

    steps:
    - uses: actions/checkout@v7

    # JRuby 10.x is built for Java 21; the runner's default JDK is older.
    # setup-java fetches its own JDK, so this doesn't depend on which versions
    # the runner image happens to preinstall.
    - name: Set up Java 21 (JRuby only)
      if: matrix.ruby-version == 'jruby'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rspec

    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      if: matrix.os == 'ubuntu-latest' && matrix.ruby-version == '3.3'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/coverage.xml
        fail_ci_if_error: false

  # The gemspec promises simplecov >= 1.0, < 2.0. A normal `bundle install`
  # only exercises whatever Bundler resolves today (usually the newest), so this
  # job pins simplecov to each end of that range and runs the suite there. It
  # exists because a simplecov point release once broke main with no change on
  # our side; this turns that class of break into a failure here instead.
  compat:
    name: Compat (simplecov ${{ matrix.simplecov }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported simplecov: the first release that writes coverage.json.
          - simplecov: '1.0.0'
            version: '1.0.0'
          # Newest release. An empty pin leaves simplecov to the gemspec, so
          # Bundler takes the current version.
          - simplecov: latest
            version: ''
    env:
      SIMPLECOV_VERSION: ${{ matrix.version }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        # No bundler cache: this job must resolve fresh each run so the pins
        # above take effect and aren't masked by a restored bundle.
        bundler-cache: false

    - name: Install (simplecov ${{ matrix.simplecov }})
      run: bundle install --jobs 4

    - name: Show resolved simplecov
      run: bundle list | grep simplecov

    - name: Run tests
      run: bundle exec rspec

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.6'
        bundler-cache: true

    - name: Audit dependencies for vulnerabilities
      run: bundle exec bundle audit check --update

    - name: Audit Ruby version for vulnerabilities
      run: bundle exec ruby-audit check

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0.6'
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop
